name: CPU correctness

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unittest:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'torch>=2.8,<3' --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -e '.[muon]' pytest pytest-subtests
      - run: python -m compileall -q terminus production tests
      - run: python -m pytest tests -q
        env:
          OMP_NUM_THREADS: '1'
          MKL_NUM_THREADS: '1'
      - run: for script in scripts/train.sh scripts/build_h100_fa3.sh production/train.sh production/build_runtime.sh; do bash -n "$script"; done
